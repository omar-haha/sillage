[project]
name = "sillage"
version = "0.1.0"
description = "A systematic multi-asset fund: one engine for backtesting, paper trading, and live execution."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "MIT" }
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "duckdb>=1.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "exchange-calendars>=4.6",
    "typer>=0.12",
    "rich>=13.8",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "yfinance>=0.2.50",
]

[project.scripts]
sillage = "sillage.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sillage"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "ARG", "PTH"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]

[tool.mypy]
python_version = "3.13"
files = ["src/sillage", "tests"]
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

# The layers where correctness is non-negotiable get full strict mode.
# Third-party libraries without type stubs. Listed explicitly rather than with a
# blanket ignore, so a newly added untyped dependency is a deliberate decision.
[[tool.mypy.overrides]]
module = ["yfinance.*", "exchange_calendars.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["sillage.core.*", "sillage.engine.*", "sillage.portfolio.*", "sillage.risk.*"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["network: hits a live external API (deselect with -m 'not network')"]
