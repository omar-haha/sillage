name: Diagnose Sillage incident
on:
  workflow_dispatch:
    inputs:
      conversation:
        required: true
        description: Existing completed OpenHands conversation ID
      issue:
        required: true
        default: '1'
        description: Incident issue number
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

concurrency:
  group: sillage-diagnosis-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.event.label.name == 'sillage-incident' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Ask OpenHands for a read-only diagnosis
        id: openhands
        env:
          OPENHANDS_API_KEY: ${{ secrets.OPENHANDS_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
          EXISTING_CONVERSATION: ${{ inputs.conversation }}
        run: |
          evidence=$(gh issue view "$ISSUE" --repo "$REPOSITORY" --json body --jq .body)
          delivered=$(gh issue view "$ISSUE" --repo "$REPOSITORY" --json comments --jq '[.comments[] | select(.author.login == "github-actions" and (.body | contains("<!-- sillage-diagnosis-v1 -->")))] | length')
          if [ "$delivered" -gt 0 ]; then
            echo 'A validated diagnosis already exists for this incident.'
            exit 0
          fi
          prompt="Diagnose incident #$ISSUE. Read repository code at the deployed commit recorded in the evidence (use git show for that revision). Read-only commands and GitHub reads are allowed. Do not mutate repository, infrastructure, broker or journal state, bypass reconciliation, post comments, or apply labels. Write your final report to /workspace/project/comment_body.md with these headings: Probable cause, Evidence, Confidence, Safe next action. Include exactly one line Recommendation: needs-human or Recommendation: approve:restart-gateway or Recommendation: approve:rerun-cycle. Approval labels are recommendations for the human only. Finish after writing the file. Incident evidence follows:
          $evidence"
          payload=$(jq -n --arg prompt "$prompt" --arg repository "$REPOSITORY" \
            '{initial_message:{content:[{type:"text",text:$prompt}]},selected_repository:$repository}')
          if [ -z "$EXISTING_CONVERSATION" ]; then
          start=$(curl --fail --silent --show-error --max-time 30 \
            -X POST https://app.all-hands.dev/api/v1/app-conversations \
            -H "Authorization: Bearer $OPENHANDS_API_KEY" \
            -H 'Content-Type: application/json' --data "$payload")
          task_id=$(jq -er '.id' <<<"$start")
          conversation_id=$(jq -r '.app_conversation_id // empty' <<<"$start")
          for _ in {1..60}; do
            [ -n "$conversation_id" ] && break
            sleep 5
            task=$(curl --fail --silent --show-error --max-time 20 \
              "https://app.all-hands.dev/api/v1/app-conversations/start-tasks?ids=$task_id" \
              -H "Authorization: Bearer $OPENHANDS_API_KEY")
            status=$(jq -r '(if type == "array" then .[0] else . end) | .status // "UNKNOWN"' <<<"$task")
            [ "$status" = ERROR ] && { jq . <<<"$task"; exit 1; }
            conversation_id=$(jq -r '(if type == "array" then .[0] else . end) | .app_conversation_id // empty' <<<"$task")
          done
          [ -n "$conversation_id" ] || { echo 'Timed out starting OpenHands'; exit 1; }
          else
            conversation_id="$EXISTING_CONVERSATION"
          fi
          conversation_url="https://app.all-hands.dev/conversations/$conversation_id"
          echo "conversation-url=$conversation_url" >> "$GITHUB_OUTPUT"
          saw_running=false
          for attempt in {1..40}; do
            sleep 30
            conversation=$(curl --fail --silent --show-error --max-time 20 \
              "https://app.all-hands.dev/api/v1/app-conversations?ids=$conversation_id" \
              -H "Authorization: Bearer $OPENHANDS_API_KEY")
            status=$(jq -r '.[0].execution_status // "unknown"' <<<"$conversation")
            echo "OpenHands execution status: $status"
            [ "$status" = running ] && saw_running=true
            case "$status" in
              finished) break ;;
              idle) if $saw_running; then break; fi ;;
              error|stuck|paused|waiting_for_confirmation|deleting)
                echo "status=$status" >> "$GITHUB_OUTPUT"; exit 1 ;;
            esac
          done
          case "$status" in idle|finished) ;; *) echo 'Timed out waiting for OpenHands'; exit 1 ;; esac
          echo "status=$status" >> "$GITHUB_OUTPUT"
          artifact=$(curl --fail --silent --show-error --get --max-time 20 \
            "https://app.all-hands.dev/api/v1/app-conversations/$conversation_id/file" \
            -H "Authorization: Bearer $OPENHANDS_API_KEY" \
            --data-urlencode 'file_path=/workspace/project/comment_body.md')
          echo "Artifact response type: $(jq -r type <<< "$artifact")"
          diagnosis=$(jq -r 'if type == "string" then . else .content // .text // empty end' <<< "$artifact")
          if [ -z "$diagnosis" ]; then
            events=$(curl --fail --silent --show-error --max-time 20 \
              "https://app.all-hands.dev/api/v1/conversation/$conversation_id/events/search?kind__eq=MessageEvent&sort_order=TIMESTAMP_DESC&limit=20" \
              -H "Authorization: Bearer $OPENHANDS_API_KEY")
            echo "Message event count: $(jq '.items | length' <<< "$events")"
            jq '[.items[] | {source,fields:keys,message_fields:(.llm_message // {} | keys)}]' <<< "$events"
            diagnosis=$(jq -r '[.items[] | select(.source == "agent") | (.llm_message.content // .content // []) | if type == "array" then map(.text // empty) | join("\n") else . end | select(contains("Recommendation:"))][0] // empty' <<< "$events")
          fi
          test -n "$diagnosis"
          test "$(printf '%s\n' "$diagnosis" | grep -Ec '^Recommendation: (needs-human|approve:restart-gateway|approve:rerun-cycle)$')" = 1
          for heading in 'Probable cause' Evidence Confidence 'Safe next action'; do
            printf '%s' "$diagnosis" | grep -Fqi "$heading"
          done
          printf '<!-- sillage-diagnosis-v1 -->\n%s\n\nIncident: %s\nOpenHands: %s\n' "$diagnosis" "$ISSUE" "$conversation_url" > "$RUNNER_TEMP/diagnosis.md"
          gh issue comment "$ISSUE" --repo "$REPOSITORY" --body-file "$RUNNER_TEMP/diagnosis.md"
      - name: Email diagnosis and approval request
        if: steps.openhands.outputs.status != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
          ISSUE_URL: https://github.com/${{ github.repository }}/issues/${{ github.event.issue.number || inputs.issue }}
          CONVERSATION_URL: ${{ steps.openhands.outputs.conversation-url }}
          RESEND_API_KEY: ${{ secrets.SILLAGE_RESEND_API_KEY }}
          REPORT_FROM: ${{ secrets.SILLAGE_REPORT_FROM }}
          REPORT_TO: ${{ secrets.SILLAGE_REPORT_TO }}
        run: |
          diagnosis=$(< "$RUNNER_TEMP/diagnosis.md")
          body=$(jq -n \
            --arg from "${REPORT_FROM:-onboarding@resend.dev}" \
            --arg to "$REPORT_TO" \
            --arg subject "Sillage diagnosis - approval may be required" \
            --arg text "$diagnosis

          Incident: $ISSUE_URL
          OpenHands: $CONVERSATION_URL

          Apply only the recommended approve:* label on the incident issue." \
            '{from:$from,to:[$to],subject:$subject,text:$text}')
          curl --fail --silent --show-error --max-time 20 \
            -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H 'Content-Type: application/json' \
            --data "$body"
      - name: Report diagnosis delivery failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
          URL: ${{ steps.openhands.outputs.conversation-url }}
          STATUS: ${{ steps.openhands.outputs.status }}
          RESEND_API_KEY: ${{ secrets.SILLAGE_RESEND_API_KEY }}
          REPORT_FROM: ${{ secrets.SILLAGE_REPORT_FROM }}
          REPORT_TO: ${{ secrets.SILLAGE_REPORT_TO }}
        run: |
          gh issue comment "$ISSUE" --body "Diagnosis delivery failed. Review this workflow run and OpenHands conversation: $URL. No recovery is approved."
          body=$(jq -n --arg from "$REPORT_FROM" --arg to "$REPORT_TO" \
            --arg text "Diagnosis delivery failed for incident #$ISSUE. Review https://github.com/$GITHUB_REPOSITORY/issues/$ISSUE and $URL. Human investigation is required; no recovery is approved." \
            '{from:$from,to:[$to],subject:"Sillage diagnosis delivery failed",text:$text}')
          curl --fail --silent --show-error --max-time 20 \
            -X POST https://api.resend.com/emails -H "Authorization: Bearer $RESEND_API_KEY" \
            -H 'Content-Type: application/json' --data "$body"
