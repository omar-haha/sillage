name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Format & lint
        run: |
          uv run ruff format --check src tests
          uv run ruff check src tests

      - name: Type check
        run: uv run mypy

      # Deselect anything touching a live API so CI never depends on a
      # third-party service being up.
      - name: Tests
        run: uv run pytest -m "not network" --cov=sillage --cov-report=term-missing

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci
        working-directory: web

      # Type-checking and bundling both pass on a component that throws when mounted,
      # so the render tests are the ones that matter here.
      - name: Typecheck
        run: npm run typecheck
        working-directory: web

      - name: Tests
        run: npm test
        working-directory: web

      - name: Build
        run: npm run build
        working-directory: web
